<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>CEO's iPhone — Interactive Demo</title><style>
*{box-sizing:border-box}body{margin:0;background:#101118;color:white;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;display:grid;place-items:center;min-height:100dvh}.phone{position:relative;width:min(100vw,405px);height:min(100dvh,860px);min-height:620px;overflow:hidden;background:#080c19;border:7px solid #25252b;border-radius:48px;box-shadow:0 20px 80px #0009}.wall{position:absolute;inset:0;background:radial-gradient(ellipse at 80% 65%,#e28eac 0%,transparent 35%),radial-gradient(ellipse at 15% 30%,#6676d5 0%,transparent 43%),linear-gradient(140deg,#151733,#272044 60%,#100f26)}.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:31px;border-radius:25px;background:#050506;z-index:20}.status{position:absolute;top:17px;left:30px;right:27px;display:flex;justify-content:space-between;font-size:14px;font-weight:700;z-index:19}.status span:last-child{letter-spacing:2px}.screen{position:absolute;inset:0;padding:67px 20px 38px;display:none;overflow-y:auto;scrollbar-width:none}.screen.active{display:block}.lock{display:flex!important;flex-direction:column;align-items:center;text-align:center;padding-top:100px}.lock.hidden{display:none!important}.lock .date{font-size:19px}.lock .clock{font-size:83px;font-weight:200;letter-spacing:-5px}.lock .hint{margin-top:auto;margin-bottom:20px;opacity:.9;font-size:14px}.unlock{border:0;background:#ffffff35;color:white;padding:14px 26px;border-radius:25px;font-size:16px;cursor:pointer}.home-title{font-size:13px;text-align:center;opacity:.85;margin-bottom:23px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:25px 12px}.app{text-align:center;cursor:pointer;font-size:11px;text-shadow:0 1px 4px #0007}.icon{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;margin:0 auto 7px;font-size:32px;background:#fff;color:#111;box-shadow:0 5px 16px #0003}.dock{position:absolute;bottom:35px;left:15px;right:15px;background:#ffffff38;border:1px solid #ffffff35;border-radius:25px;padding:12px 6px;display:flex;justify-content:space-around;backdrop-filter:blur(18px)}.dock .icon{margin:0}.bar{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:125px;height:5px;border-radius:10px;background:#fff;z-index:30;cursor:pointer}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.back{border:0;background:none;color:#278bff;font-size:16px;cursor:pointer;padding:0}.appscreen{background:#f5f5f9;color:#111}.appscreen .bar{background:#222}.appscreen h1{font-size:32px;margin:10px 0 20px}.card{background:white;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 1px 2px #0001;cursor:pointer}.muted{color:#888;font-size:12px}.row{display:flex;align-items:center;gap:12px}.avatar{height:46px;width:46px;border-radius:50%;background:#d8e9fa;display:grid;place-items:center;font-size:23px;flex-shrink:0}.bubble{padding:11px 13px;border-radius:17px;margin:9px 0;max-width:86%;font-size:14px;line-height:1.45;background:#e9e9ef;white-space:pre-line}.bubble.me{margin-left:auto;background:#c8f5bd}.chatbox{padding-bottom:50px}.notice{position:absolute;top:52px;left:12px;right:12px;background:#e9e9f2ed;color:#17171c;padding:13px 15px;border-radius:18px;z-index:35;box-shadow:0 6px 30px #0004;display:none;cursor:pointer;backdrop-filter:blur(20px);font-size:13px}.notice.show{display:block}.call{position:absolute;inset:0;background:linear-gradient(#383a49,#10131e);z-index:40;display:none;text-align:center;padding-top:115px}.call.show{display:block}.call .caller{font-size:32px;margin:20px}.call .callbtns{display:flex;justify-content:space-around;margin-top:160px}.round{border:0;width:76px;height:76px;border-radius:50%;font-size:29px;color:white;cursor:pointer}.green{background:#31c75b}.red{background:#f04450}.calllabel{font-size:12px;margin-top:10px}.sheet{position:absolute;inset:0;background:#101522ef;z-index:41;display:none;align-items:center;justify-content:center;padding:30px;text-align:center}.sheet.show{display:flex}.modal{background:white;color:#17171d;border-radius:25px;padding:28px 18px;width:100%;line-height:1.6}.btn{border:0;border-radius:12px;padding:12px 18px;background:#287bff;color:white;cursor:pointer;font-weight:600}.secondary{background:#e5e6eb;color:#17171d}.small{font-size:13px}.pill{display:inline-block;background:#e9efff;border-radius:20px;padding:6px 10px;font-size:12px;margin:4px}.photo{background:linear-gradient(120deg,#a6a4ef,#e9a6c9);border-radius:16px;aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:10px;font-size:18px;font-weight:700}.photos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.setting{display:flex;justify-content:space-between}.toggle{background:#35c95d;color:white;border-radius:20px;padding:3px 10px}.footer{position:absolute;bottom:0;left:0;right:0;height:33px;pointer-events:none}.edithelp{font-size:12px;opacity:.85;text-align:center;margin-top:25px}.badge{position:absolute;right:1px;top:-7px;background:#f13d43;border-radius:20px;padding:3px 6px;font-size:10px}.relative{position:relative} @media(min-width:550px){body{padding:22px}.phone{height:820px}}@media(max-width:430px){.phone{border:0;border-radius:0;height:100dvh;min-height:0;width:100vw}.icon{width:60px;height:60px}}
</style></head><body><main class="phone"><div class="wall"></div><div class="island"></div><div class="status"><span id="statusTime">9:41</span><span>▮▮▮ ◕ ▰</span></div><section id="lock" class="screen lock"><div class="date" id="lockDate"></div><div class="clock" id="lockTime">9:41</div><div style="font-size:50px;margin-top:25px">🔒</div><div class="hint">CEO's iPhone<br><br>Swipe up or tap to unlock</div><button class="unlock" onclick="unlock()">Swipe up ↑</button></section><section id="home" class="screen"><div class="home-title">CEO's iPhone · Interactive parody</div><div class="grid" id="apps"></div><div class="edithelp">Explore freely. Something might happen… 👀</div><div class="dock" id="dock"></div></section><section id="content" class="screen appscreen"><div class="top"><button class="back" onclick="goHome()">‹ Home</button><span id="appCaption" class="muted"></span></div><div id="appBody"></div></section><div class="notice" id="notice" onclick="openNotification()"></div><div class="call" id="call"><div style="opacity:.75">incoming call…</div><div class="caller" id="caller">PMO 📞</div><div style="opacity:.7">mobile</div><div class="callbtns"><div><button class="round red" onclick="endCall(false)">✕</button><div class="calllabel">Decline</div></div><div><button class="round green" onclick="endCall(true)">☎</button><div class="calllabel">Accept</div></div></div></div><div class="sheet" id="sheet"><div class="modal"><div id="sheetText"></div><button class="btn" onclick="closeSheet()" style="margin-top:14px">OK 😂</button></div></div><div class="bar" onclick="goHome()"></div></main><script>
/* =========================================================
   EDIT YOUR CONTENT HERE ✨
   Change names, project updates, jokes and calendar entries.
   This is a fictional parody; avoid confidential real data.
   ========================================================= */
const DATA={
 owner:'CEO',
 pmoName:'PMO 👀',
 chats:[
  {name:'PMO 👀',emoji:'👩🏻‍💻',preview:'All updates are ready… almost 😂',messages:[
   ['them','Good morning! Any updates?'],['me','Good morning! Which project? 😇'],['them','All of them.'],['me','Of course you would say that 😂'],
   ['me','📌 STRATEGY PROJECT\nStatus: CEO recommendation submitted; awaiting committee approval.\nNext step: Committee decision.'],
   ['me','📌 IT PROJECTS\nCurrent status: [ADD YOUR REAL UPDATE HERE]\nTarget date: [ADD DATE]'],
   ['them','Are we on track?'],['me','Would you like the short answer or the detailed follow-up? 👀']
  ]},
  {name:'IT Updates',emoji:'💻',preview:'Final version (really final) v9',messages:[['them','We are almost done.'],['me','Great! What is the exact completion date?'],['them','We will update you shortly.'],['me','That sounds familiar 😂']]},
  {name:'Operations',emoji:'📊',preview:'Just one small challenge…',messages:[['them','We have one small challenge.'],['me','How small?'],['them','It needs a meeting.'],['me','Of course it does 😂']]}
 ],
 emails:[
  {from:'Approvals Department',subject:'URGENT: Just One More Approval',body:'Dear CEO,\n\nWe promise this is the last approval request today.\n\nBest regards,\nEveryone'},
  {from:'Everyone',subject:'RE: FINAL_final_v12_APPROVED?',body:'Please find the final version attached. This is the final version of the final version. Probably.'},
  {from:'PMO',subject:'Friendly follow-up 👀',body:'Just checking in. Again. With respect. 😂'}
 ],
 calendar:[['09:00','Morning Meeting'],['10:00','Follow-up Meeting'],['11:00','Meeting About the Previous Meeting'],['12:00','Meeting to Reduce Meetings'],['14:00','One Quick Approval (45 min)']],
 notes:[['CEO Survival Checklist','☐ Review updates\n☐ Approve requests\n☐ Follow up with everyone\n☐ Ask PMO to follow up on the follow-ups'],['Things People Say','“Almost done”\n“Just one more week”\n“Quick question”\n“Final version”']],
 photoCaptions:['CEO after clearing the inbox ☕','When someone says “quick meeting” 😭','Pending approvals: ∞','Friday mood ✨'],
 callName:'PMO Calling… 📞',
 callAnswer:'Good morning! Just a quick update…\n\nEstimated call duration: 2 minutes\nActual duration: 45 minutes 😂',
 callDecline:'Missed call from PMO.\nFollow-up required. 👀',
 notifications:['MAIL · One more approval needed.','CALENDAR · Meeting about meetings starts soon.','PMO · Friendly reminder 👀']
};
/* ========================================================= */
const icons=[['WhatsApp','💬','#25d366'],['Mail','✉️','#278cff'],['Calendar','📅','#fff'],['Notes','📝','#ffe56d'],['Photos','🌄','#fff'],['Phone','📞','#36c65b'],['Settings','⚙️','#a9a9b1'],['CEO Mode','👔','#1d2132']];let opened=0,called=false,notifIndex=0,notifTimer=null,currentApp='';
function el(id){return document.getElementById(id)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function visible(id){['lock','home','content'].forEach(x=>el(x).classList.toggle('active',x===id));el('lock').classList.toggle('hidden',id!=='lock')}function unlock(){visible('home')}function goHome(){visible('home')}function showSheet(t){el('sheetText').innerHTML=t;el('sheet').classList.add('show')}function closeSheet(){el('sheet').classList.remove('show')}
function makeIcons(){el('apps').innerHTML=icons.map(([name,emoji,color])=>`<div class="app" onclick="openApp('${name}')"><div class="icon" style="background:${color}">${emoji}</div>${name}</div>`).join('');el('dock').innerHTML=['Phone','WhatsApp','Mail','Photos'].map(name=>{let a=icons.find(x=>x[0]===name);return `<div class="app" onclick="openApp('${name}')"><div class="icon" style="background:${a[2]}">${a[1]}</div></div>`}).join('')}
function openApp(name){currentApp=name;visible('content');el('appCaption').textContent=name;opened++;let html='';if(name==='WhatsApp'){html=`<h1>Chats</h1>`+DATA.chats.map((c,i)=>`<div class="card row" onclick="showChat(${i})"><div class="avatar">${c.emoji}</div><div><b>${escapeHTML(c.name)}</b><div class="muted">${escapeHTML(c.preview)}</div></div></div>`).join('')}else if(name==='Mail'){html='<h1>Inbox <span class="muted">(999+)</span></h1>'+DATA.emails.map((m,i)=>`<div class="card" onclick="showEmail(${i})"><b>${escapeHTML(m.from)}</b><div>${escapeHTML(m.subject)}</div><div class="muted">Tap to read</div></div>`).join('')}else if(name==='Calendar'){html='<h1>Calendar</h1><div class="muted">Today · A very normal CEO day</div>'+DATA.calendar.map(e=>`<div class="card"><b>${escapeHTML(e[0])}</b> &nbsp; ${escapeHTML(e[1])}</div>`).join('')}else if(name==='Notes'){html='<h1>Notes</h1>'+DATA.notes.map((n,i)=>`<div class="card" onclick="showNote(${i})"><b>${escapeHTML(n[0])}</b><div class="muted">Tap to open</div></div>`).join('')}else if(name==='Photos'){html='<h1>Photos</h1><div class="photos">'+DATA.photoCaptions.map((p,i)=>`<div class="photo" onclick="showSheet('${escapeHTML(p).replace(/'/g,'&#39;')}')">${escapeHTML(p)}</div>`).join('')+'</div><p class="muted">You can replace these cards with your own memes later.</p>'}else if(name==='Phone'){html='<h1>Phone</h1><div class="card" onclick="incomingCall()">📞 &nbsp; Call PMO (demo)</div><div class="card">Recent calls <span class="muted">(too many)</span></div>'}else if(name==='Settings'){html='<h1>Settings</h1>'+[['CEO Mode','Always ON'],['Do Not Disturb','Unavailable'],['Pending Approvals','∞'],['Battery Health','Needs vacation'],['Follow-up Notifications','ON']].map(x=>`<div class="card setting"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}else{html='<h1>CEO Mode 👔</h1><div class="card">Stress level: <b>999%</b></div><div class="card">Meetings remaining: <b>∞</b></div><div class="card">Survival status: <b>Legendary 🏆</b></div><button class="btn" onclick="showSheet('🎉 Congratulations!<br>You survived another day as CEO 😂')">Finish the day</button>'}el('appBody').innerHTML=html;if(opened===2)notify(DATA.notifications[0]);if(opened===3&&!called)setTimeout(incomingCall,900);if(opened>=5&&opened%2===1)notify(DATA.notifications[(notifIndex++)%DATA.notifications.length])}
function showChat(i){let c=DATA.chats[i];el('appBody').innerHTML=`<div class="top"><button class="back" onclick="openApp('WhatsApp')">‹ Chats</button><b>${escapeHTML(c.name)}</b></div><div class="chatbox">`+c.messages.map(([who,msg])=>`<div class="bubble ${who==='me'?'me':''}">${escapeHTML(msg)}</div>`).join('')+'</div>'}function showEmail(i){let m=DATA.emails[i];el('appBody').innerHTML=`<h1>${escapeHTML(m.subject)}</h1><div class="muted">From: ${escapeHTML(m.from)}</div><div class="card" style="white-space:pre-line;line-height:1.6">${escapeHTML(m.body)}</div>`}function showNote(i){let n=DATA.notes[i];el('appBody').innerHTML=`<h1>${escapeHTML(n[0])}</h1><div class="card" style="white-space:pre-line;line-height:1.9">${escapeHTML(n[1])}</div>`}
function notify(msg){el('notice').innerHTML='🔔 &nbsp; '+escapeHTML(msg);el('notice').classList.add('show');clearTimeout(notifTimer);notifTimer=setTimeout(()=>el('notice').classList.remove('show'),5200)}function openNotification(){el('notice').classList.remove('show');openApp('Mail')}function incomingCall(){if(el('call').classList.contains('show'))return;called=true;el('caller').textContent=DATA.callName;el('call').classList.add('show')}function endCall(answer){el('call').classList.remove('show');showSheet(escapeHTML(answer?DATA.callAnswer:DATA.callDecline).replace(/\n/g,'<br>'))}
let now=new Date();el('lockDate').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});let time=now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:false});el('lockTime').textContent=time;el('statusTime').textContent=time;makeIcons();visible('lock');let touchY=0;el('lock').addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});el('lock').addEventListener('touchend',e=>{if(touchY-e.changedTouches[0].clientY>35)unlock()},{passive:true});
</script></body></html>
